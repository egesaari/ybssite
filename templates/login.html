<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yönetici Girişi - Beykent YBS</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 flex items-center justify-center min-h-screen">
    <div class="max-w-md w-full p-8 bg-slate-900 border border-slate-800 rounded-2xl shadow-xl">
        <h1 class="text-xl font-bold text-center mb-6">Yönetici Girişi</h1>
        
        {% with messages = get_flashed_messages() %}
          {% if messages %}
            <div class="mb-4 p-3 bg-red-500/10 border border-red-500/20 text-red-400 text-sm rounded-lg text-center">
              {{ messages[0] }}
            </div>
          {% endif %}
        {% endwith %}

        <form method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-400 uppercase mb-2">Yönetici Şifresi</label>
                <input type="password" name="password" required class="w-full px-4 py-3 bg-slate-950 border border-slate-800 rounded-xl focus:border-blue-500 focus:outline-none text-white">
            </div>
            <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-500 text-white font-medium rounded-xl transition-all shadow-lg shadow-blue-600/20">Giriş Yap</button>
        </form>
        <div class="text-center mt-6">
            <a href="/" class="text-xs text-slate-500 hover:text-slate-300">&larr; Ana Sayfaya Dön</a>
        </div>
    </div>
</body>
</html>
