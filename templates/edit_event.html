<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <title>Etkinlik Düzenle - Beykent YBS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-light">
    <div class="container mt-5">
        <h2>Etkinliği Düzenle</h2>
        <form method="POST" enctype="multipart/form-data" class="mt-4">
            <div class="mb-3">
                <label class="form-label">Etkinlik Başlığı</label>
                <input type="text" class="form-control" name="title" value="{{ event.title }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Açıklama</label>
                <textarea class="form-control" name="description" rows="4" required>{{ event.description }}</textarea>
            </div>
            <div class="mb-3">
                <label class="form-label">Tarih</label>
                <input type="text" class="form-control" name="date" value="{{ event.date }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Konum</label>
                <input type="text" class="form-control" name="location" value="{{ event.location }}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Kayıt / Katılım Linki (Opsiyonel)</label>
                <input type="url" class="form-control" name="rsvp_link" value="{{ event.rsvp_link }}">
            </div>
            <div class="mb-3">
                <label class="form-label">Yeni Görsel (İsteğe bağlı)</label>
                <input type="file" class="form-control" name="image">
            </div>
            <button type="submit" class="btn btn-warning">Güncelle</button>
            <a href="{{ url_for('admin') }}" class="btn btn-secondary">İptal</a>
        </form>
    </div>
</body>
</html>
